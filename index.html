<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Potato Pops</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Fredoka',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#fffaf2;
    color:#4e342e;
}

/* NAVBAR */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:#fffaf2;
    position:sticky;
    top:0;
    z-index:1000;
}

nav img{
    width:120px;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin:0 15px;
}

nav ul li a{
    text-decoration:none;
    color:#4e342e;
    font-weight:500;
    transition:0.3s;
}

nav ul li a:hover{
    color:#ff9800;
}

/* BUTTON */

.btn{
    background:#ffb000;
    color:white;
    text-decoration:none;
    padding:12px 28px;
    border-radius:50px;
    font-weight:600;
    display:inline-block;
    transition:0.3s;
}

.btn:hover{
    background:#ff9800;
    transform:translateY(-3px);
}

/* HERO */

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    padding:80px 60px;
    background:linear-gradient(135deg,#FFF8EC,#FFE8B5);
}

.hero-text{
    flex:1;
    min-width:300px;
}

.hero-text h2{
    font-size:42px;
    color:#4e342e;
}

.hero-text h1{
    font-size:110px;
    color:#FFB000;
    line-height:1;
    text-shadow:
        4px 4px 0 #ffffff,
        8px 8px 15px rgba(0,0,0,0.08);
}

.hero-text p{
    margin:25px 0;
    max-width:450px;
    line-height:1.8;
    color:#5d4037;
}

.hero-image{
    flex:1;
    text-align:center;
    min-width:300px;
}

.hero-image img{
    width:380px;
    max-width:100%;
    border-radius:20px;
}

/* SECTION */

section{
    padding:70px 60px;
}

section h2{
    text-align:center;
    margin-bottom:20px;
    font-size:40px;
}

/* VIDEO */

.video-section{
    text-align:center;
}

.video-section video{
    width:70%;
    max-width:700px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* PRODUK */

.produk{
    background:linear-gradient(180deg,#ffcc66,#ffb300);
}

.produk h2{
    color:white;
}

.grand-opening{
    background:white;
    display:inline-block;
    padding:10px 20px;
    border-radius:15px;
    font-weight:600;
    margin-bottom:40px;
}

.grid{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    width:280px;
    background:white;
    padding:20px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    border-radius:15px;
}

.card h3{
    margin-top:15px;
    margin-bottom:10px;
}

.badge{
    background:#ff6b6b;
    color:white;
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    display:inline-block;
    margin-bottom:10px;
}

.price{
    margin:15px 0;
}

.price del{
    color:#e53935;
}

.price b{
    color:#2e7d32;
    font-size:22px;
}

/* VISI MISI */

.visi-misi{
    background:#fff8ec;
}

.visi-misi p{
    margin:15px auto;
    max-width:800px;
    line-height:1.8;
    text-align:center;
}

/* KONTAK */

.kontak{
    background:#5c3b1e;
    color:white;
    text-align:center;
}

.kontak p{
    margin:15px 0;
}

.kontak a{
    color:#ffcc66;
    text-decoration:none;
}

.kontak a:hover{
    color:white;
}

/* FOOTER */

footer{
    background:#4a2f17;
    color:white;
    text-align:center;
    padding:20px;
}

/* FLOATING WA */

.wa{
    position:fixed;
    right:20px;
    bottom:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#25D366;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    font-size:28px;
}

/* RESPONSIVE */

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:15px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero{
        flex-direction:column;
        text-align:center;
    }

    .hero-text h1{
        font-size:80px;
    }

    .hero-text h2{
        font-size:32px;
    }

    .video-section video{
        width:100%;
    }

    section{
        padding:50px 25px;
    }

}

</style>
</head>
